<script>/* ══════════════════════════════════════════════════════════════════════

    clearTimeout(timer);

    /* forget very old keys */
    Object.keys(fired).forEach(function(k){ if(now - fired[k] > 1000*86400*90) delete fired[k]; });
    list.forEach(function(x){
      var t = x.t.getTime();
      if(t <= now && now - t < 36*3600e3 && !fired[x.key]) due.push(x);
    });
    if(due.length){
      due.forEach(function(x){ fired[x.key] = now; });
      M8.store.set(FIRED, fired);
      /* one message per cheque, newest trigger wins */
      var seen = {}, uniq = due.filter(function(x){ if(seen[x.q.id]) return false; seen[x.q.id] = 1; return true; });
      if(uniq.length > 2){
        var tot = uniq.reduce(function(s,x){ return s + (+x.q.amount||0); }, 0);
        show(uniq.length+' cheques need attention · AED '+money(tot), uniq.map(function(x){ return x.q.party; }).slice(0,3).join(', ')+(uniq.length>3?' and more':'')+'. Check the bank balance and deposit money in time if needed.', 'm8-chq-sum', null);
      } else uniq.forEach(function(x){ var m = message(x.q); show(m.title, m.body, 'm8-chq-'+x.q.id, x.q); });
    } else M8.store.set(FIRED, fired);

    try{

        navigator.serviceWorker.getRegistration().then(function(reg){

    var next = list.filter(function(x){ return x.t.getTime() > now; })[0];

  }

  /* ═════════════ REGISTER PAGE ═════════════
     Two simple choices decide what you see:
       Show  — Pending · Overdue · Cleared · All
       When  — Any date · Next 7 days · This month · Next month · Last month · Pick a month · From–to
     The four boxes at the top and the 14-day strip just set those two for you. */
  var VIEW = !!window.M8_VIEWER;

  var PER = [['all','Any date'],['7d','Next 7 days'],['month','This month'],['next','Next month'],['last','Last month'],['pick','Pick a month'],['range','From – to']];
  function monthBounds(off){ var d = localToday(); d.setDate(1); d.setMonth(d.getMonth()+off); var e = new Date(d.getFullYear(), d.getMonth()+1, 0); return [iso(d), iso(e)]; }
  function perRange(){

    if(V.per === 'month') return monthBounds(0);
    if(V.per === 'next') return monthBounds(1);
    if(V.per === 'last') return monthBounds(-1);
    if(V.per === 'pick' && V.ym){ var p = V.ym.split('-'), last = new Date(+p[0], +p[1], 0); return [V.ym+'-01', iso(last)]; }
    if(V.per === 'range') return [V.from || '0000-00-00', V.to || '9999-12-31'];

    return null;
  }
