<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0a1f3d">
<meta name="apple-mobile-web-app-title" content="Cheque Viewer">
<link rel="apple-touch-icon" href="icon-512.png?v=3">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=3">
<link rel="manifest" href="manifest.json?v=3">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://al-madhi-ledger-default-rtdb.firebaseio.com">
<title>Cheque Register — View Only</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #e7edf6;
  --surface:   #ffffff;
  --surface2:  #f5f8fc;
  --border:    rgba(15,40,80,.11);
  --border2:   rgba(15,40,80,.18);
  --hdr-bg:    #0a1f3d;
  --hdr-bg2:   #123156;
  --gold:      #c69320;
  --gold2:     #dcae35;
  --gold3:     #f2cf63;
  --gold-lt:   rgba(220,174,53,.15);
  --green:     #0fa968;
  --green-lt:  rgba(15,169,104,.11);
  --red:       #e23b4b;
  --red-lt:    rgba(226,59,75,.10);
  --amber:     #d9860a;
  --amber-lt:  rgba(217,134,10,.12);
  --t1: #0e1b2e;
  --t2: #43536b;
  --t3: #7d8a9e;
  --font: 'Plus Jakarta Sans', sans-serif;
  --mono: 'Plus Jakarta Sans', sans-serif;
  --radius: 11px;
  --radius-lg: 16px;
  --shadow: 0 1px 3px rgba(15,35,70,.08), 0 8px 24px rgba(15,35,70,.11);
}
body.dark {
  --bg: #091120; --surface: #0f1c30; --surface2: #152439;
  --border: rgba(220,174,53,.13); --border2: rgba(220,174,53,.21);
  --t1: #eaf0f8; --t2: #a7b4c8; --t3: #6f7d92;
  --green-lt: rgba(15,169,104,.15); --red-lt: rgba(226,59,75,.15); --amber-lt: rgba(217,134,10,.18);
}
* { box-sizing: border-box; }
html,body { margin:0; padding:0; }
body {
  font-family: var(--font); background: var(--bg); color: var(--t1);
  -webkit-tap-highlight-color: transparent; min-height: 100vh;
  padding-bottom: 24px;
}
header.topbar {
  background: linear-gradient(135deg, var(--hdr-bg) 0%, var(--hdr-bg2) 100%);
  padding: 14px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  position: sticky; top:0; z-index: 50; box-shadow: 0 4px 18px rgba(0,0,0,.18);
  border-bottom: 2px solid var(--gold2);
}
.tb-left { display:flex; align-items:center; gap:10px; min-width:0; }
.tb-shield { flex-shrink:0; width:34px; height:34px; }
.tb-title { color:#fff; font-weight:800; font-size:15px; line-height:1.2; }
.tb-sub { display:flex; align-items:center; gap:5px; margin-top:1px; }
.tb-dot { width:6px; height:6px; border-radius:50%; background:var(--green); box-shadow:0 0 0 0 rgba(15,169,104,.6); animation: pulse 2s infinite; }
@keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(15,169,104,.55);} 70%{box-shadow:0 0 0 6px rgba(15,169,104,0);} 100%{box-shadow:0 0 0 0 rgba(15,169,104,0);} }
.tb-sub-text { color: var(--gold3); font-size: 10.5px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; }
.tb-right { display:flex; align-items:center; gap:8px; flex-shrink:0; }
.theme-btn { background: rgba(255,255,255,.09); border:none; border-radius:8px; width:34px; height:34px; color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.install-btn {
  display:none; align-items:center; gap:5px; height:34px; padding:0 12px;
  border:none; border-radius:8px; cursor:pointer;
  background:linear-gradient(135deg,var(--gold3),var(--gold2) 55%,var(--gold));
  color:#1a1200; font-family:var(--font); font-weight:800; font-size:12.5px;
  box-shadow:0 2px 10px rgba(220,174,53,.35);
  -webkit-tap-highlight-color:transparent;
}
.install-btn:active { transform:scale(.96); }

.wrap { max-width: 1200px; margin: 0 auto; padding: 14px; }

.card { background: var(--surface); border-radius: var(--radius-lg); border:1px solid var(--border); box-shadow: var(--shadow); }
.filter-card { padding: 16px 18px; margin-bottom: 14px; }
.form-row { display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; }
.form-group { flex:1 1 200px; min-width: 160px; margin-bottom:0; }
.form-group label { display:block; font-size:10.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color: var(--t3); margin-bottom:5px; }
.form-group input, .form-group select {
  width:100%; height:42px; padding:0 12px; border-radius: 9px; border:1.5px solid var(--border2);
  background: var(--surface2); color: var(--t1); font-family: var(--font); font-size:14px; outline:none;
}
.form-group input:focus, .form-group select:focus { border-color: var(--gold2); }
.btn { display:inline-flex; align-items:center; gap:6px; height:42px; padding:0 14px; border-radius:9px; border:1.5px solid var(--border2);
  background: var(--surface2); color: var(--t1); font-family: var(--font); font-weight:700; font-size:13px; cursor:pointer; white-space:nowrap; }
.btn:hover { background: var(--gold-lt); border-color: var(--gold2); }

.chip-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
.chip { border:1.5px solid var(--border2); background:var(--surface2); color:var(--t2); font-family:var(--font);
  font-weight:700; font-size:12.5px; padding:8px 14px; border-radius:20px; cursor:pointer; }
.chip.sm { padding:6px 12px; font-size:12px; }
.chip.active { background: var(--gold2); border-color: var(--gold2); color:#1a1200; }
.seg { display:inline-flex; border:1.5px solid var(--border2); border-radius:20px; overflow:hidden; }
.seg button { border:none; background:var(--surface2); color:var(--t2); font-family:var(--font); font-weight:700; font-size:12.5px; padding:8px 16px; cursor:pointer; }
.seg button.active { background: var(--hdr-bg); color:#fff; }
.day-hint { font-size:10.5px; color:var(--t3); font-weight:700; text-transform:uppercase; letter-spacing:.4px; }

.summary-bar { background: linear-gradient(135deg,var(--hdr-bg) 0%, var(--hdr-bg2) 100%); border-radius: var(--radius-lg);
  padding: 14px 16px 15px; margin-bottom:14px; }
.summary-top { display:flex; align-items:baseline; justify-content:space-between; gap:8px; flex-wrap:wrap; }
.summary-label { color: rgba(255,255,255,.6); font-size:10.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; }
.summary-total { color:#fff; font-size:22px; font-weight:800; letter-spacing:-.5px; }
.summary-count { color: var(--gold3); font-size:11.5px; font-weight:700; }
.summary-split { display:flex; gap:9px; margin-top:11px; }
.summary-box { flex:1; min-width:0; background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.07); border-radius:11px;
  padding:10px 13px 11px; cursor:pointer; text-align:left; font-family:inherit; -webkit-tap-highlight-color:transparent; }
.summary-box-label { color:rgba(255,255,255,.55); font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.6px; }
.summary-box-row { display:flex; align-items:baseline; justify-content:space-between; gap:4px; margin-top:4px; }
.summary-box-total { font-size:15.5px; font-weight:800; letter-spacing:-.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.summary-box-count { color:rgba(255,255,255,.55); font-size:10.5px; font-weight:700; white-space:nowrap; }
.summary-box.cleared .summary-box-total { color:#86efac; }
.summary-box.pending .summary-box-total { color:#fde68a; }
.summary-box.cleared.active { background:rgba(134,239,172,.20); border-color:#86efac; }
.summary-box.pending.active { background:rgba(253,230,138,.20); border-color:#fde68a; }

.tbl-wrap { border-radius: var(--radius-lg); border:1px solid var(--border); overflow:auto; background:var(--surface); box-shadow: var(--shadow); }
table { width:100%; border-collapse:collapse; font-size:13.5px; min-width: 760px; }
thead th { text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--t3); font-weight:800;
  padding:12px 14px; border-bottom:1.5px solid var(--border); background:var(--surface2); position:sticky; top:0; }
tbody td { padding:12px 14px; border-bottom:1px solid var(--border); vertical-align:middle; }
tbody tr:last-child td { border-bottom:none; }
tbody tr:hover { background: var(--surface2); }
.mono { font-variant-numeric: tabular-nums; }
.fw-700 { font-weight:700; }
.badge { display:inline-flex; padding:4px 10px; border-radius:20px; font-size:11.5px; font-weight:700; border:1px solid transparent; }
.aed-sym { height:0.78em; width:auto; vertical-align:middle; position:relative; top:-0.04em; display:inline-block; fill:currentColor; }

.empty-state { text-align:center; padding:50px 20px; color:var(--t3); }
.empty-state svg { opacity:.35; margin-bottom:10px; }

.footer-note { text-align:center; color:var(--t3); font-size:11.5px; margin-top:18px; padding: 0 20px; line-height:1.6; }

/* ═══════════════════════════════════════════════════════════════
   DAYS SLIDER — same control as the main Al Madhi app.
   One continuous draggable line instead of a row of fixed 1d/2d/…
   buttons. It's a native <input type=range>, so the drag is handled
   by the browser and stays smooth on a phone; only the paint is ours.
   ═══════════════════════════════════════════════════════════════ */
.chq-days {
  margin-top:14px; border:1px solid var(--border); border-radius:15px;
  background:linear-gradient(180deg,var(--surface2) 0%,var(--surface) 72%);
  padding:13px 15px 15px;
  transition:border-color .2s ease, box-shadow .2s ease;
}
.chq-days.is-active {
  border-color:rgba(220,174,53,.55);
  box-shadow:0 0 0 3px rgba(220,174,53,.10);
}
.chq-days-top { display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
.chq-days .seg button { padding:6px 13px; font-size:11.5px; }
.chq-days-stepper { flex:1; display:flex; align-items:center; justify-content:flex-end; gap:7px; }
.chq-days-step {
  width:23px; height:23px; flex:0 0 auto; padding:0;
  border:1px solid var(--border2); border-radius:50%;
  background:var(--surface); color:var(--t2);
  font-family:inherit; font-size:14px; font-weight:700; line-height:1;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:color .14s ease, border-color .14s ease, background .14s ease, transform .1s ease;
}
.chq-days-step:hover { border-color:var(--gold2); color:var(--gold); background:var(--gold-lt); }
.chq-days-step:active { transform:scale(.9); }
.chq-days-readout {
  flex:0 0 auto; min-width:56px; text-align:right; font-family:var(--mono);
  line-height:1; color:var(--t3); transition:color .2s ease;
}
.chq-days.is-active .chq-days-readout { color:var(--gold); }
#days-readout-n { font-size:19px; font-weight:800; letter-spacing:-.3px; }
#days-readout-word { font-size:11px; font-weight:700; }
.chq-days-reset {
  display:none; width:24px; height:24px; padding:0; border-radius:50%; flex:0 0 auto;
  border:1px solid var(--border2); background:var(--surface); color:var(--t3);
  cursor:pointer; align-items:center; justify-content:center;
  -webkit-tap-highlight-color:transparent;
  transition:color .16s ease, border-color .16s ease;
}
.chq-days-reset svg { width:11px; height:11px; }
.chq-days-reset:hover { color:var(--red); border-color:var(--red); }

.chq-days-track { position:relative; padding:2px 2px 0; }
/* The range input IS the line — a thin filled track plus a round gold thumb.
   --chq-days-pct is written from JS on every value change so the fill and
   the thumb move together with no extra DOM or layout work. */
.chq-days-range {
  -webkit-appearance:none; appearance:none;
  width:100%; height:26px; margin:0; background:transparent; cursor:pointer;
  touch-action:pan-y;
}
.chq-days-range::-webkit-slider-runnable-track {
  height:6px; border-radius:4px;
  background:linear-gradient(90deg,
    var(--gold2) 0%, var(--gold2) var(--chq-days-pct,20%),
    var(--border2) var(--chq-days-pct,20%), var(--border2) 100%);
}
.chq-days-range::-moz-range-track { height:6px; border-radius:4px; background:var(--border2); }
.chq-days-range::-moz-range-progress { height:6px; border-radius:4px; background:var(--gold2); }
.chq-days-range::-webkit-slider-thumb {
  -webkit-appearance:none; appearance:none;
  width:22px; height:22px; border-radius:50%; margin-top:-8px;
  background:#fff; border:3px solid var(--gold2);
  box-shadow:0 2px 8px rgba(220,174,53,.35), 0 1px 3px rgba(0,0,0,.15);
  transition:transform .12s cubic-bezier(.34,1.56,.64,1), box-shadow .12s ease;
}
.chq-days-range::-moz-range-thumb {
  width:22px; height:22px; border-radius:50%; border:3px solid var(--gold2);
  background:#fff; box-shadow:0 2px 8px rgba(220,174,53,.35);
}
.chq-days-range:active::-webkit-slider-thumb { transform:scale(1.18); box-shadow:0 3px 12px rgba(220,174,53,.5); }
.chq-days-range:focus-visible::-webkit-slider-thumb { outline:2px solid var(--gold); outline-offset:2px; }

.chq-days-ticks { position:relative; height:19px; margin-top:1px; }
/* a tick for every day, taller + numbered every 5th so it stays readable */
.chq-days-ticks i {
  position:absolute; top:0; width:1px; height:4px;
  background:var(--border2); transform:translateX(-50%);
}
.chq-days-ticks i.maj { height:7px; background:var(--t3); opacity:.55; }
.chq-days-ticks b {
  position:absolute; top:9px; transform:translateX(-50%);
  font-size:9px; font-weight:700; color:var(--t3); font-family:var(--mono);
}
@media (prefers-reduced-motion:reduce) {
  .chq-days-range::-webkit-slider-thumb { transition-duration:1ms; }
}

@media (max-width: 640px) {
  table { min-width: 640px; }
  .summary-total { font-size:20px; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="tb-left">
    <svg class="tb-shield" viewBox="0 0 24 24" fill="none" stroke="#dcae35" stroke-width="1.6"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V5l-8-3Z" fill="rgba(220,174,53,.12)"/><path d="M8 12h8M8 9h8M8 15h5"/></svg>
    <div>
      <div class="tb-title">Cheque Register</div>
      <div class="tb-sub"><span class="tb-dot"></span><span class="tb-sub-text" id="sync-label">Live · View Only</span></div>
    </div>
  </div>
  <div class="tb-right">
    <button class="install-btn" id="install-btn" onclick="installApp()" title="Install app" style="display:none">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Install
    </button>
    <button class="theme-btn" onclick="toggleTheme()" title="Toggle dark mode">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</header>

<div class="wrap">

  <div class="card filter-card">
    <div class="form-row">
      <div class="form-group" style="flex:2 1 220px">
        <label>Search</label>
        <input type="text" id="v-search" placeholder="Party, cheque no., note…" oninput="renderAll()">
      </div>
      <div class="form-group" style="flex:0 0 150px">
        <label>Status</label>
        <select id="v-status" onchange="renderAll()">
          <option value="all">All</option>
          <option value="pending">Pending</option>
          <option value="cleared">Cleared</option>
        </select>
      </div>
      <button class="btn" onclick="clearFilters()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Clear
      </button>
    </div>

    <div class="chip-row" id="range-chips">
      <button class="chip" data-s="all" onclick="setShortcut('all')">All Time</button>
      <button class="chip" data-s="lastmonth" onclick="setShortcut('lastmonth')">Last Month</button>
      <button class="chip" data-s="thismonth" onclick="setShortcut('thismonth')">This Month</button>
      <button class="chip" data-s="nextmonth" onclick="setShortcut('nextmonth')">Next Month</button>
      <button class="chip" data-s="twomonths" onclick="setShortcut('twomonths')">2 Months After</button>
      <button class="chip" data-s="custom" onclick="setShortcut('custom')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:3px"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Custom
      </button>
    </div>

    <div id="custom-range-wrap" style="display:none;gap:14px;margin-top:10px;flex-wrap:wrap">
      <div class="form-group" style="flex:0 0 160px"><label>From</label><input type="date" id="v-from" onchange="renderAll()"></div>
      <div class="form-group" style="flex:0 0 160px"><label>To</label><input type="date" id="v-to" onchange="renderAll()"></div>
    </div>

    <!-- Upcoming/Past + a single draggable line instead of fixed day buttons.
         Slide to N and the list shows cheques due in the next/past N days.
         Tap the × to drop back to the month chips above. -->
    <div class="chq-days" id="chq-days">
      <div class="chq-days-top">
        <div class="seg" id="day-direction">
          <button type="button" class="active" data-d="upcoming" onclick="setDayDirection('upcoming')">Upcoming</button>
          <button type="button" data-d="past" onclick="setDayDirection('past')">Past</button>
        </div>
        <div class="chq-days-stepper">
          <button type="button" class="chq-days-step" onclick="dayStep(-1)" aria-label="One day fewer">&minus;</button>
          <div class="chq-days-readout">
            <span id="days-readout-n">7</span><span id="days-readout-word">&nbsp;Days</span>
          </div>
          <button type="button" class="chq-days-step" onclick="dayStep(1)" aria-label="One day more">+</button>
        </div>
        <button type="button" class="chq-days-reset" id="chq-days-reset" onclick="clearDaySlider()" title="Clear day filter">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="chq-days-track">
        <input type="range" id="chq-days-slider" class="chq-days-range" min="1" max="30" step="1" value="7"
               oninput="daySliderInput(this.value)" onchange="daySliderCommit(this.value)"
               aria-label="Number of days">
        <div class="chq-days-ticks" aria-hidden="true">
            <i class="maj" style="left:calc(11px + (100% - 22px) * 0.000000)"></i>
            <b style="left:calc(11px + (100% - 22px) * 0.000000)">1</b>
            <i style="left:calc(11px + (100% - 22px) * 0.034483)"></i>
            <i style="left:calc(11px + (100% - 22px) * 0.068966)"></i>
            <i style="left:calc(11px + (100% - 22px) * 0.103448)"></i>
            <i class="maj" style="left:calc(11px + (100% - 22px) * 0.137931)"></i>
            <b style="left:calc(11px + (100% - 22px) * 0.137931)">5</b>
            <i style="left:calc(11px + (100% - 22px) * 0.172414)"></i>
            <i style="left:calc(11px + (100% - 22px) * 0.206897)"></i>
            <i style="left:calc(11px + (100% - 22px) * 0.241379)"></i>
            <i style="left:calc(11px + (100% - 22px) * 0.275862)"></i>
            <i class="maj" style="left:calc(11px + (100% - 22px) * 0.310345)"></i>
            <b style="left:calc(11px + (100% - 22px) * 0.310345)">10</b>
            <i style="left:calc(11px + (100% - 22px) * 0.344828)"></i>
            <i style="left:calc(11px + (100% - 22px) * 0.379310)"></i>
            <i style="left:calc(11px + (100% - 22px) * 0.413793)"></i>
            <i style="left:calc(11px + (100% - 22px) * 0.448276)"></i>
            <i class="maj" style="left:calc(11px + (100% - 22px) * 0.482759)"></i>
            <b style="left:calc(11px + (100% - 22px) * 0.482759)">15</b>
            <i style="left:calc(11px + (100% - 22px) * 0.517241)"></i>

let shortcut = 'thismonth';
let dayDirection = 'upcoming';

function esc(s) { return (s==null?'':String(s)).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmt(n) { return Number(n||0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function today() { return new Date().toISOString().split('T')[0]; }
function fmtDate(d) {
  if(!d) return '—';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
}

function getRange() {
  const now = new Date(); now.setHours(0,0,0,0);
  if(shortcut==='thismonth')  return { start: new Date(now.getFullYear(), now.getMonth(), 1), end: new Date(now.getFullYear(), now.getMonth()+1, 0, 23,59,59) };
  if(shortcut==='lastmonth')  return { start: new Date(now.getFullYear(), now.getMonth()-1, 1), end: new Date(now.getFullYear(), now.getMonth(), 0, 23,59,59) };
  if(shortcut==='nextmonth')  return { start: new Date(now.getFullYear(), now.getMonth()+1, 1), end: new Date(now.getFullYear(), now.getMonth()+2, 0, 23,59,59) };
  if(shortcut==='twomonths')  return { start: new Date(now.getFullYear(), now.getMonth()+2, 1), end: new Date(now.getFullYear(), now.getMonth()+3, 0, 23,59,59) };
  if(shortcut==='custom') {
    const from = document.getElementById('v-from')?.value;
    const to   = document.getElementById('v-to')?.value;
    if(from && to) return { start: new Date(from+'T00:00:00'), end: new Date(to+'T23:59:59') };
    return null;
  }
  const dayMatch = /^d(\d+)$/.exec(shortcut||'');
  if(dayMatch) {
    const n = parseInt(dayMatch[1], 10);
    if(dayDirection==='past') { const start = new Date(now); start.setDate(start.getDate()-n); return { start, end: new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23,59,59) }; }
    const end = new Date(now); end.setDate(end.getDate()+n); end.setHours(23,59,59,999);
    return { start: now, end };
  }
  return null; // 'all'
}
function rangeLabel() {
  const labels = { all:'All Time', lastmonth:'Last Month', thismonth:'This Month', nextmonth:'Next Month', twomonths:'2 Months After', custom:'Custom Range' };
  const dayMatch = /^d(\d+)$/.exec(shortcut||'');
  if(dayMatch) return `${dayDirection==='past'?'Past':'Next'} ${dayMatch[1]} Days`;
  return labels[shortcut] || 'All Time';
}

function updateChipStates() {
  document.querySelectorAll('#range-chips .chip').forEach(b => b.classList.toggle('active', b.dataset.s===shortcut));
  document.getElementById('custom-range-wrap').style.display = shortcut==='custom' ? 'flex' : 'none';
  syncDaySlider();
}

// ═══════════ DAYS SLIDER ═══════════
// One draggable line instead of a row of fixed 1d/2d/…/30d buttons. The
// filter underneath (shortcut = "d<n>", direction in dayDirection) is
// unchanged — this only replaces how the number gets picked.
let _daysRaf = null;

function syncDaySlider() {
  const wrap  = document.getElementById('chq-days');
  const range = document.getElementById('chq-days-slider');
  if(!wrap || !range) return;
  const m = /^d(\d+)$/.exec(shortcut||'');
  const active = !!m;
  wrap.classList.toggle('is-active', active);
  const n = m ? Math.min(30, Math.max(1, parseInt(m[1],10))) : parseInt(range.value,10) || 7;
  if(String(n) !== range.value) range.value = n;
  _paintDaysReadout(n);
  document.querySelectorAll('#day-direction button').forEach(b => b.classList.toggle('active', b.dataset.d===dayDirection));
  const reset = document.getElementById('chq-days-reset');
  if(reset) reset.style.display = active ? 'inline-flex' : 'none';
}

function _paintDaysReadout(n) {
  const nEl = document.getElementById('days-readout-n');
  const wEl = document.getElementById('days-readout-word');
  if(nEl) nEl.textContent = n;
  if(wEl) wEl.textContent = ' Day' + (n==1 ? '' : 's');
  const range = document.getElementById('chq-days-slider');
  if(range) range.style.setProperty('--chq-days-pct', ((n-1)/29*100) + '%');
}

// Fires continuously while dragging — keep it to a cheap label/fill repaint
// and coalesce the actual table re-render to once per animation frame, so a
// fast drag never queues up more work than the screen can show.
function daySliderInput(v) {
  const n = parseInt(v,10) || 1;
  _paintDaysReadout(n);
  const wrap = document.getElementById('chq-days');
  if(wrap) wrap.classList.add('is-active');
  if(_daysRaf) return;
  _daysRaf = requestAnimationFrame(function(){
    _daysRaf = null;
    // Read the slider fresh, right now — NOT the "n" this call closed over.
    // A fast drag fires many input ticks before one frame paints; only the
    // first gets in here (the rest bail on the guard above), so trusting its
    // captured value would apply whatever the finger passed through first
    // instead of where it actually ended up.
    const range = document.getElementById('chq-days-slider');
    const live = range ? (parseInt(range.value,10) || n) : n;
    shortcut = 'd' + live;
    updateChipStates();
    renderAll();
  });
}

// Fires once on release — guarantees the final value lands even if the last
// rAF-coalesced input tick got dropped.
function daySliderCommit(v) {
  const n = parseInt(v,10) || 1;
  shortcut = 'd' + n;
  updateChipStates();
  renderAll();
}

// Nudge the window by one day. Works whether or not the day filter is the
// active one — stepping from a month view adopts the slider's existing
// number rather than silently resetting it.
function dayStep(delta) {
  const range = document.getElementById('chq-days-slider');
  if(!range) return;
  const cur = parseInt(range.value, 10) || 1;
  const next = Math.min(30, Math.max(1, cur + delta));
  if(next === cur && /^d\d+$/.test(shortcut||'')) return;
  range.value = next;
  daySliderCommit(next);
}

function clearDaySlider() {
  shortcut = 'thismonth';
  updateChipStates();
  renderAll();
}

function setShortcut(s) { shortcut = s; updateChipStates(); renderAll(); }

function setDayDirection(d) {
  dayDirection = d;
  document.querySelectorAll('#day-direction button').forEach(b => b.classList.toggle('active', b.dataset.d===d));
  // Only re-filter if a day window is actually the active filter — flipping
  // Upcoming/Past while "This Month" is selected shouldn't silently switch
  // the whole page onto the day filter.
  if(/^d\d+$/.test(shortcut||'')) renderAll();
}

function clearFilters() {
  document.getElementById('v-search').value = '';
  document.getElementById('v-status').value = 'all';
  document.getElementById('v-from').value = '';
  document.getElementById('v-to').value = '';
  shortcut = 'thismonth';
  dayDirection = 'upcoming';
  updateChipStates();
  renderAll();
}

function getFiltered() {
  let list = [...(window._cheques||[])];
  const kw = (document.getElementById('v-search')?.value || '').trim().toLowerCase();
  const status = document.getElementById('v-status')?.value || 'all';

  if(kw) list = list.filter(c =>
    (c.party||'').toLowerCase().includes(kw) ||
    (c.chequeNo||'').toLowerCase().includes(kw) ||
    (c.note||'').toLowerCase().includes(kw)
  );
  if(status==='pending') list = list.filter(c => !c.cleared);
  if(status==='cleared') list = list.filter(c => c.cleared);

  const range = getRange();
  if(range) list = list.filter(c => { const d = new Date(c.date+'T00:00:00'); return d >= range.start && d <= range.end; });

  return list.sort((a,b) => (a.date||'').localeCompare(b.date||''));
}

// Same range + search as getFiltered(), but ignoring the status dropdown — this is
// what powers the Cleared/Pending split in the summary bar so it always covers every
// party and status within the selected date range.
function getRangeFiltered() {
  let list = [...(window._cheques||[])];
  const kw = (document.getElementById('v-search')?.value || '').trim().toLowerCase();
  if(kw) list = list.filter(c =>
    (c.party||'').toLowerCase().includes(kw) ||
    (c.chequeNo||'').toLowerCase().includes(kw) ||
    (c.note||'').toLowerCase().includes(kw)
  );
  const range = getRange();
  if(range) list = list.filter(c => { const d = new Date(c.date+'T00:00:00'); return d >= range.start && d <= range.end; });
  return list;
}

function rowHTML(c, i) {
  const overdue = !c.cleared && c.date < today();
  const badge = c.cleared
    ? `<span class="badge" style="background:var(--green-lt);color:var(--green)">Cleared</span>`
    : overdue
      ? `<span class="badge" style="background:var(--red-lt);color:var(--red)">Overdue</span>`
      : `<span class="badge" style="background:var(--amber-lt);color:var(--amber)">Pending</span>`;
  return `<tr>
    <td style="color:var(--t3)">${i+1}</td>
    <td>${fmtDate(c.date)}</td>
    <td class="fw-700">${esc(c.party)}</td>
    <td class="mono">${esc(c.chequeNo||'—')}</td>
    <td class="mono fw-700">${AED} ${fmt(c.amount)}</td>
    <td style="color:var(--t2);font-size:12.5px">${esc(c.note||'—')}</td>
    <td>${badge}</td>
  </tr>`;
}

function renderAll() {
  const list = getFiltered();
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = list.length
    ? list.map(rowHTML).join('')
    : `<tr><td colspan="7"><div class="empty-state">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
        <div>No cheques match this filter</div>
       </div></td></tr>`;

  const parts = [rangeLabel()];
  const kw = (document.getElementById('v-search')?.value || '').trim();
  if(kw) parts.push(`"${kw}"`);

  // Top row: total for the whole range + search, regardless of status —
  // never skewed by which status box is currently active.
  const rangeList = getRangeFiltered();
  const rangeTotal = rangeList.reduce((s,c)=>s+Number(c.amount||0),0);
  const clearedList = rangeList.filter(c=>c.cleared);
  const pendingList = rangeList.filter(c=>!c.cleared);
  const clearedTotal = clearedList.reduce((s,c)=>s+Number(c.amount||0),0);
  const pendingTotal = pendingList.reduce((s,c)=>s+Number(c.amount||0),0);

  document.getElementById('summary-label').textContent = parts.join(' · ');
  document.getElementById('summary-total').innerHTML = `${AED} ${fmt(rangeTotal)}`;
  document.getElementById('summary-count').textContent = `${rangeList.length} cheque${rangeList.length!==1?'s':''}`;
  document.getElementById('summary-cleared-total').innerHTML = `${AED} ${fmt(clearedTotal)}`;
  document.getElementById('summary-cleared-count').textContent = `${clearedList.length} cheque${clearedList.length!==1?'s':''}`;
  document.getElementById('summary-pending-total').innerHTML = `${AED} ${fmt(pendingTotal)}`;
  document.getElementById('summary-pending-count').textContent = `${pendingList.length} cheque${pendingList.length!==1?'s':''}`;

  const activeStatus = document.getElementById('v-status')?.value || 'all';
  document.getElementById('summary-cleared-box').classList.toggle('active', activeStatus==='cleared');
  document.getElementById('summary-pending-box').classList.toggle('active', activeStatus==='pending');
}

// Tapping the Cleared or Pending box filters the table to just that status;
// tapping the already-active one clears the filter back to All.
function filterByStatus(status) {
  const sel = document.getElementById('v-status');
  if(!sel) return;
  sel.value = (sel.value === status) ? 'all' : status;
  renderAll();
}

function toggleTheme() {
  document.body.classList.toggle('dark');
  localStorage.setItem('chqviewer_theme', document.body.classList.contains('dark') ? 'dark' : 'light');
}
if(localStorage.getItem('chqviewer_theme') === 'dark') document.body.classList.add('dark');

updateChipStates();
window.renderAll = renderAll;
window.setShortcut = setShortcut;
window.setDayDirection = setDayDirection;
window.clearFilters = clearFilters;
window.daySliderInput = daySliderInput;
window.daySliderCommit = daySliderCommit;
window.dayStep = dayStep;
window.clearDaySlider = clearDaySlider;
window.toggleTheme = toggleTheme;
window.filterByStatus = filterByStatus;

// ═══════════ SERVICE WORKER + INSTALL ═══════════
// Registration errors used to be swallowed silently, which made a failed
// install impossible to diagnose from the phone. Now every outcome is
// recorded in _diag and surfaced by the #debug panel below.
window._diag = { sw: 'not started', swScope: '—', manifest: 'not checked', bip: 'not fired' };

if('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js?v=3').then(function(reg) {
      window._diag.sw = 'registered';
      window._diag.swScope = reg.scope;
      const w = reg.installing || reg.waiting || reg.active;
      if(w) window._diag.sw = 'registered · ' + w.state;
      paintDiag();
    }).catch(function(err) {
      window._diag.sw = 'FAILED — ' + (err && err.message ? err.message : err);
      paintDiag();
    });
  });
} else {
  window._diag.sw = 'not supported by this browser';
}

// Chrome and Samsung Internet fire this only when every install requirement
// is met. Catching it gives us a real in-page Install button — far more
// reliable than hunting through the browser menu.
let _deferredPrompt = null;
window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  _deferredPrompt = e;
  window._diag.bip = 'fired — installable';
  const btn = document.getElementById('install-btn');
  if(btn) btn.style.display = 'flex';
  paintDiag();
});

window.addEventListener('appinstalled', function() {
  window._diag.bip = 'installed';
  const btn = document.getElementById('install-btn');
  if(btn) btn.style.display = 'none';
});

function installApp() {
  if(!_deferredPrompt) return;
  _deferredPrompt.prompt();
  _deferredPrompt.userChoice.finally(function(){ _deferredPrompt = null; });
}

// ═══════════ #debug PANEL ═══════════
// Add #debug to the URL to see exactly which install requirement is failing.
// Invisible otherwise, so it costs normal users nothing.
function paintDiag() {
  const el = document.getElementById('diag');
  if(!el || location.hash !== '#debug') return;
  const d = window._diag;
  const rows = [
    ['Secure origin (https)', location.protocol === 'https:' ? 'yes' : 'NO — install needs https'],
    ['Display mode', window.matchMedia('(display-mode: standalone)').matches ? 'standalone (already installed)' : 'browser tab'],
    ['Service worker', d.sw],
    ['SW scope', d.swScope],
    ['Manifest', d.manifest],
    ['Install prompt event', d.bip],
    ['Page URL', location.href]
  ];
  el.innerHTML = '<div style="font-weight:800;margin-bottom:8px">Install diagnostics</div>' +
    rows.map(function(r){
      const bad = /NO|FAIL|not fired|not supported|missing/i.test(r[1]);
      return '<div style="display:flex;gap:8px;padding:4px 0;border-bottom:1px solid var(--border);font-size:12px">' +
        '<span style="flex:0 0 130px;color:var(--t3);font-weight:700">' + r[0] + '</span>' +
        '<span style="flex:1;word-break:break-all;color:' + (bad ? 'var(--red)' : 'var(--t1)') + '">' + esc(r[1]) + '</span></div>';
    }).join('');
  el.style.display = 'block';
}

// Fetch the manifest ourselves so a 404 or a JSON typo shows up plainly
// instead of the browser just quietly refusing to offer an install.
fetch('manifest.json?v=3').then(function(r) {
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}).then(function(m) {
  const has192 = (m.icons||[]).some(function(i){ return /(^|\s)192x192(\s|$)/.test(i.sizes||''); });
  const has512 = (m.icons||[]).some(function(i){ return /(^|\s)512x512(\s|$)/.test(i.sizes||''); });
  window._diag.manifest = 'loaded · ' + (m.icons||[]).length + ' icons' +
    (has192 && has512 ? '' : ' — missing ' + (has192?'':'192px ') + (has512?'':'512px'));
  paintDiag();
}).catch(function(err) {
  window._diag.manifest = 'FAILED — ' + (err && err.message ? err.message : err);
  paintDiag();
});

window.addEventListener('hashchange', paintDiag);
window.addEventListener('load', paintDiag);
window.installApp = installApp;
</script>
</body>
</html>
