# GitHub code scanning (CodeQL): looks through the app's code for security holes
# (unsafe HTML, injection, leaked data, risky workflow settings) on every change
# and once a week. Results: the repository's Security tab → Code scanning.
name: CodeQL security scan
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  schedule:
    - cron: '23 3 * * 1'   # every Monday
  workflow_dispatch: {}
permissions: { contents: read }
jobs:
  analyze:
    name: Scan ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # to post the results to the Security tab
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - lib   # third-party PDF/Excel libraries, already minified
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
